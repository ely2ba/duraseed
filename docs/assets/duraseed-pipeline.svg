<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">DuraSeed experimental pipeline</title>
  <desc id="desc">A common M0 checkpoint branches into supervised fine-tuning and verifier-rewarded reinforcement learning, real checkpoints are matched on measured targeted capability, and both receive identical Stage-B training while retention and learning are measured.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      text { fill: #24292f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { font-size: 16px; font-weight: 600; }
      .detail { font-size: 13px; fill: #57606a; }
      .stage { font-size: 13px; font-weight: 600; letter-spacing: .08em; fill: #57606a; }
      .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
      .line { fill: none; stroke: #57606a; stroke-width: 1.8; marker-end: url(#arrow); }
      .arrow-head { fill: #57606a; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #0d1117; }
        text { fill: #e6edf3; }
        .detail, .stage { fill: #8c959f; }
        .box { fill: #161b22; stroke: #6e7681; }
        .line { stroke: #8c959f; }
        .arrow-head { fill: #8c959f; }
      }
    </style>
  </defs>

  <rect width="1200" height="360" class="canvas"/>

  <text x="347" y="34" text-anchor="middle" class="stage">STAGE A</text>
  <text x="850" y="104" text-anchor="middle" class="stage">STAGE B</text>
  <text x="1080" y="34" text-anchor="middle" class="stage">MEASURED THROUGHOUT</text>

  <rect x="30" y="130" width="170" height="100" rx="10" class="box"/>
  <text x="115" y="169" text-anchor="middle" class="label">Common M0</text>
  <text x="115" y="194" text-anchor="middle" class="detail">same weights</text>
  <text x="115" y="214" text-anchor="middle" class="detail">fresh optimizers</text>

  <rect x="260" y="64" width="175" height="88" rx="10" class="box"/>
  <text x="347.5" y="99" text-anchor="middle" class="label">B-S · SFT</text>
  <text x="347.5" y="123" text-anchor="middle" class="detail">solver derivations</text>

  <rect x="260" y="208" width="175" height="88" rx="10" class="box"/>
  <text x="347.5" y="243" text-anchor="middle" class="label">B-G · RL</text>
  <text x="347.5" y="267" text-anchor="middle" class="detail">verifier rewards</text>

  <path d="M200 180 C225 180 230 108 260 108" class="line"/>
  <path d="M200 180 C225 180 230 252 260 252" class="line"/>

  <rect x="500" y="130" width="220" height="100" rx="10" class="box"/>
  <text x="610" y="165" text-anchor="middle" class="label">Match real checkpoints</text>
  <text x="610" y="190" text-anchor="middle" class="detail">overlapping measured</text>
  <text x="610" y="210" text-anchor="middle" class="detail">targeted capability</text>

  <path d="M435 108 C470 108 470 165 500 165" class="line"/>
  <path d="M435 252 C470 252 470 195 500 195" class="line"/>

  <rect x="770" y="130" width="160" height="100" rx="10" class="box"/>
  <text x="850" y="169" text-anchor="middle" class="label">Identical training</text>
  <text x="850" y="194" text-anchor="middle" class="detail">same Stage-B task</text>
  <text x="850" y="214" text-anchor="middle" class="detail">fresh optimizer</text>
  <path d="M720 180 L770 180" class="line"/>

  <rect x="990" y="64" width="180" height="88" rx="10" class="box"/>
  <text x="1080" y="99" text-anchor="middle" class="label">F1 · Retention</text>
  <text x="1080" y="123" text-anchor="middle" class="detail">Stage-A trajectory</text>

  <rect x="990" y="208" width="180" height="88" rx="10" class="box"/>
  <text x="1080" y="243" text-anchor="middle" class="label">F2 · Learning</text>
  <text x="1080" y="267" text-anchor="middle" class="detail">Stage-B trajectory</text>

  <path d="M930 180 C960 180 960 108 990 108" class="line"/>
  <path d="M930 180 C960 180 960 252 990 252" class="line"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="536" viewBox="0 0 1120 536" role="img" aria-labelledby="title desc">
  <title id="title">DuraSeed experimental design</title>
  <desc id="desc">One common format-capable M0 origin branches into supervised arithmetic learning, B-S, and reinforcement learning, B-G. Checkpoints are matched on targeted capability; no overlap means no Stage B. F3 records behavior and new-task baseline before the selected models separately receive the same 480-update Stage-B training. F1 follows retention of arithmetic; F2 follows new-task learning relative to each model's own baseline. Across-seed replication precedes conditional mechanism tests and fresh-seed confirmation. These follow-ups require separate authorization. This is a schematic, not a results plot.</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #20242c; }
    .paper { fill: #fcfcfc; }
    .title { font-size: 28px; font-weight: 650; letter-spacing: -.8px; }
    .subtitle { font-size: 16px; fill: #606775; }
    .stage { font-size: 21px; font-weight: 600; letter-spacing: -.35px; }
    .label { font-size: 17px; font-weight: 600; }
    .body { font-size: 15px; }
    .note { font-size: 13px; fill: #606775; }
    .small { font-size: 12px; fill: #606775; }
    .rule { stroke: #d8dce2; stroke-width: 1; }
    .flow { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
    .connector { fill: none; stroke: #8c94a1; stroke-width: 1.2; stroke-linejoin: round; }
    .sft-line { stroke: #164beb; }
    .rl-line { stroke: #d92432; }
    .sft-ink { fill: #164beb; }
    .rl-ink { fill: #d92432; }
    .point { fill: #fcfcfc; stroke-width: 1.7; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #13161b; }
      text { fill: #edf0f5; }
      .subtitle, .note, .small { fill: #a8b1bf; }
      .rule { stroke: #343b47; }
      .connector { stroke: #8994a5; }
      .sft-line { stroke: #5485ff; }
      .rl-line { stroke: #ff4b5b; }
      .sft-ink { fill: #5485ff; }
      .rl-ink { fill: #ff4b5b; }
      .point { fill: #13161b; }
    }
  </style>

  <rect width="1120" height="536" class="paper"/>
  <text x="28" y="39" class="title">DuraSeed <tspan font-weight="400" class="subtitle">/ experimental design</tspan></text>
  <text x="1092" y="37" text-anchor="end" class="subtitle">Retention × future learning</text>

  <text x="28" y="89" class="stage">One origin</text>
  <text x="238" y="89" class="stage">Learn</text>
  <text x="238" y="114" class="note">STAGE A · ARITHMETIC</text>
  <text x="550" y="89" class="stage">Match</text>
  <text x="550" y="114" class="note">TARGETED CAPABILITY</text>
  <text x="808" y="89" class="stage">Train again</text>
  <text x="808" y="114" class="note">STAGE B · PROGRAM SYNTHESIS</text>

  <!-- The two paths remain separate models throughout. -->
  <text x="82" y="224" text-anchor="middle" class="title">M0</text>
  <text x="82" y="252" text-anchor="middle" class="note">Same weights</text>
  <text x="82" y="272" text-anchor="middle" class="note">Fresh optimizers</text>
  <path d="M115 215 H154" class="connector"/>
  <path d="M154 215 V168 H218 M211 163 L218 168 L211 173" class="flow sft-line"/>
  <path d="M154 215 V262 H218 M211 257 L218 262 L211 267" class="flow rl-line"/>

  <text x="238" y="151" class="label sft-ink">B-S / Supervised learning</text>
  <path d="M238 168 H622" class="flow sft-line"/>
  <text x="238" y="193" class="body">Verified solutions</text>
  <text x="238" y="245" class="label rl-ink">B-G / Reinforcement learning</text>
  <path d="M238 262 H622" class="flow rl-line"/>
  <text x="238" y="287" class="body">Verifier rewards</text>
  <g class="point sft-line">
    <circle cx="484" cy="168" r="3.5"/>
    <circle cx="516" cy="168" r="3.5"/>
    <circle cx="548" cy="168" r="3.5"/>
  </g>
  <g class="point rl-line">
    <circle cx="484" cy="262" r="3.5"/>
    <circle cx="516" cy="262" r="3.5"/>
    <circle cx="548" cy="262" r="3.5"/>
  </g>
  <text x="238" y="326" class="note">Checkpoints every 10 updates</text>
  <text x="238" y="347" class="note">294 SFT · 50 RL updates</text>

  <circle cx="622" cy="168" r="7" class="sft-ink"/>
  <circle cx="622" cy="262" r="7" class="rl-ink"/>
  <path d="M622 181 V201 M622 231 V249" class="connector"/>
  <text x="622" y="221" text-anchor="middle" class="body">Similar score</text>
  <text x="604" y="304" text-anchor="end" class="note">No overlap → stop</text>
  <path d="M622 277 V340 M618 334 L622 340 L626 334" class="connector"/>
  <text x="622" y="365" text-anchor="middle" class="label">F3 / Starting profile</text>
  <text x="622" y="388" text-anchor="middle" class="note">Behavior + new-task baseline</text>

  <path d="M629 168 H1086 M1078 163 L1086 168 L1078 173" class="flow sft-line"/>
  <path d="M629 262 H1086 M1078 257 L1086 262 L1078 267" class="flow rl-line"/>
  <text x="948" y="214" text-anchor="middle" class="body">Same data · same recipe</text>
  <text x="948" y="236" text-anchor="middle" class="note">480 updates · fresh optimizers</text>

  <!-- A brace groups the two observations; it does not merge model weights. -->
  <path d="M808 293 V301 H1088 V293 M948 301 V325 M848 340 V325 H1044 V340" class="connector"/>
  <text x="848" y="365" text-anchor="middle" class="label">F1 / Retention</text>
  <text x="848" y="388" text-anchor="middle" class="note">Old-skill trajectory</text>
  <text x="1044" y="365" text-anchor="middle" class="label">F2 / Learning</text>
  <text x="1044" y="388" text-anchor="middle" class="note">Gain vs own baseline</text>

  <path d="M28 417 H1092" class="rule"/>
  <text x="28" y="451" class="small">FOLLOW-UP PATH</text>
  <text x="28" y="480" class="stage">Across-seed replication</text>
  <path d="M290 473 H365 M358 468 L365 473 L358 478" class="connector"/>
  <text x="394" y="480" class="stage">Mechanism tests*</text>
  <text x="394" y="503" class="note">Replay · adapter rescaling</text>
  <path d="M625 473 H703 M696 468 L703 473 L696 478" class="connector"/>
  <text x="732" y="480" class="stage">Fresh-seed confirmation*</text>
  <text x="732" y="503" class="note">Power · preregister · test</text>
  <text x="28" y="522" class="small">* Conditional follow-ups · separate authorization</text>
  <text x="1092" y="522" text-anchor="end" class="small">Schematic · not to scale</text>
</svg>

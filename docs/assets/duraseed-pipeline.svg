<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="774" viewBox="0 0 1050 774" role="img" aria-labelledby="title desc">
  <title id="title">The completed DuraSeed study: two acquisition comparisons, one later-training procedure</title>
  <desc id="desc">Schematic only, not a results plot. Pilot 0 comprises two seed pairs, 11 and 29. Each branches from common origin M0 into B-S solver supervised fine-tuning and B-G verifier reinforcement learning, selects a pair by targeted arithmetic score, and continues each selected arm separately with the same 480-update MAPS supervised training. Trace replay comprises two source blocks, 11 and 29. Each branches from M0 into R-S solver traces and R-P archived reinforcement-learning traces; both use supervised fine-tuning with the same prompts, order, and recipe. Only block 11 has a matched pair and receives Stage B; block 29 has no match and no Stage-B observations. F3 profiles the selected origins. During Stage B, F1 measures old-skill arithmetic retention and F2 measures new-task MAPS learning. No model weights are merged.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #242735; }
    .editorial { font-family: Georgia, "Times New Roman", serif; font-size: 35px; }
    .eyebrow { font-size: 12px; font-weight: 600; fill: #676B78; }
    .column { font-size: 12px; font-weight: 600; letter-spacing: .7px; fill: #676B78; }
    .comparison { font-size: 19px; font-weight: 600; }
    .arm { font-size: 17px; font-weight: 600; }
    .body { font-size: 15px; }
    .note { font-size: 13px; fill: #676B78; }
    .solver { fill: #BC2344; }
    .policy { fill: #2545D9; }
    .red-path { stroke: #BC2344; }
    .blue-path { stroke: #2545D9; }
    .track { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
    .rule { stroke: #DADCD9; stroke-width: 1; }
    .origin { fill: #FAF9F5; stroke: #969BA4; stroke-width: 1.25; }
  </style>

  <rect width="1050" height="774" fill="#FAF9F5"/>
  <text x="60" y="35" class="eyebrow">DURASEED / COMPLETED STUDY</text>
  <text x="60" y="86" class="editorial">Two ways in. The same next task.</text>
  <text x="60" y="117" font-size="16" fill="#676B78">Different arithmetic acquisition histories, followed by a common learning procedure</text>
  <line x1="60" y1="138" x2="990" y2="138" stroke="#242735"/>

  <text x="76" y="170" class="column">ORIGIN</text>
  <text x="235" y="170" class="column">STAGE A / ARITHMETIC</text>
  <text x="548" y="170" class="column">SCORE SELECTION</text>
  <text x="775" y="170" class="column">STAGE B / MAPS</text>

  <text x="60" y="211" class="comparison">Pilot 0</text>
  <text x="151" y="211" class="body" fill="#676B78">Two seed pairs · 11 and 29</text>

  <!-- The two colored paths carry separate model weights throughout. -->
  <path d="M140 294.5 H177" fill="none" stroke="#969BA4" stroke-width="1.5"/>
  <path d="M177 294.5 V257 H218 M211 252 L218 257 L211 262" class="track red-path"/>
  <path d="M177 294.5 V332 H218 M211 327 L218 332 L211 337" class="track blue-path"/>
  <circle cx="108" cy="294.5" r="31" class="origin"/>
  <text x="108" y="302" text-anchor="middle" font-size="23" font-weight="600">M0</text>
  <text x="108" y="348" text-anchor="middle" class="note">Common origin</text>

  <text x="235" y="241" class="arm solver">B-S / Solver SFT</text>
  <path d="M235 257 H986 M978 252 L986 257 L978 262" class="track red-path"/>
  <text x="235" y="316" class="arm policy">B-G / Verifier RL</text>
  <path d="M235 332 H986 M978 327 L986 332 L978 337" class="track blue-path"/>
  <text x="235" y="288" class="note">Verified solutions vs. verifier rewards</text>
  <circle cx="471" cy="257" r="3" fill="#BC2344"/>
  <circle cx="497" cy="257" r="3" fill="#BC2344"/>
  <circle cx="523" cy="257" r="3" fill="#BC2344"/>
  <rect x="468" y="329" width="6" height="6" fill="#2545D9"/>
  <rect x="494" y="329" width="6" height="6" fill="#2545D9"/>
  <rect x="520" y="329" width="6" height="6" fill="#2545D9"/>

  <circle cx="628" cy="257" r="6" fill="#BC2344"/>
  <rect x="622" y="326" width="12" height="12" fill="#2545D9"/>
  <text x="628" y="287" text-anchor="middle" class="body" font-weight="600">2 pairs selected</text>
  <text x="628" y="309" text-anchor="middle" class="note">Targeted arithmetic score</text>
  <text x="628" y="368" text-anchor="middle" class="body">F3 / Starting profile</text>
  <text x="875" y="287" text-anchor="middle" class="body" font-weight="600">480 MAPS SFT updates</text>
  <text x="875" y="309" text-anchor="middle" class="note">Same data and training recipe</text>

  <line x1="60" y1="392" x2="990" y2="392" class="rule"/>
  <text x="60" y="430" class="comparison">Trace replay</text>
  <text x="199" y="430" class="body" fill="#676B78">Two source blocks · 11 and 29</text>

  <path d="M140 513.5 H177" fill="none" stroke="#969BA4" stroke-width="1.5"/>
  <path d="M177 513.5 V476 H218 M211 471 L218 476 L211 481" class="track red-path"/>
  <path d="M177 513.5 V551 H218 M211 546 L218 551 L211 556" class="track blue-path"/>
  <circle cx="108" cy="513.5" r="31" class="origin"/>
  <text x="108" y="521" text-anchor="middle" font-size="23" font-weight="600">M0</text>
  <text x="108" y="567" text-anchor="middle" class="note">Common origin</text>

  <text x="235" y="460" class="arm solver">R-S / Solver traces</text>
  <path d="M235 476 H986 M978 471 L986 476 L978 481" class="track red-path"/>
  <text x="235" y="535" class="arm policy">R-P / Archived RL traces</text>
  <path d="M235 551 H986 M978 546 L986 551 L978 556" class="track blue-path"/>
  <text x="235" y="506" class="body" font-weight="600">Both SFT</text>
  <text x="235" y="582" class="note">Same prompts · order · recipe</text>

  <circle cx="628" cy="476" r="6" fill="#BC2344"/>
  <rect x="622" y="545" width="12" height="12" fill="#2545D9"/>
  <text x="628" y="506" text-anchor="middle" class="body" font-weight="600">Block 11 matched</text>
  <text x="628" y="528" text-anchor="middle" class="note">Only this pair continues</text>
  <text x="628" y="587" text-anchor="middle" class="body">F3 / Starting profile</text>
  <text x="875" y="506" text-anchor="middle" class="body" font-weight="600">480 MAPS SFT updates</text>
  <text x="875" y="528" text-anchor="middle" class="note">Same data and training recipe</text>
  <text x="628" y="612" text-anchor="middle" class="note">Block 29: no match → no Stage B</text>

  <line x1="60" y1="639" x2="990" y2="639" class="rule"/>
  <text x="60" y="667" class="eyebrow">MEASURED DURING STAGE B</text>
  <text x="60" y="696" class="arm">F1 / Old-skill retention</text>
  <text x="60" y="720" class="body" fill="#676B78">How much arithmetic performance remains?</text>
  <text x="547" y="696" class="arm">F2 / New-task learning</text>
  <text x="547" y="720" class="body" fill="#676B78">How does MAPS performance develop?</text>
  <text x="60" y="751" class="note">Schematic only. Each selected arm continues separately; model weights are never merged.</text>
</svg>

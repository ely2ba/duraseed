    teacher_seed_sft: {grid: [1.0e-4, 3.0e-4, 1.0e-3], selected: null}
    static_sft: {grid: [1.0e-4, 3.0e-4, 1.0e-3], selected: null}
    on_policy_sft: {grid: [1.0e-4, 3.0e-4, 1.0e-3], selected: null}
    group_relative_rl: {grid: [1.0e-5, 3.0e-5, 1.0e-4], selected: null}
    stage_b_sft: {grid: [1.0e-4, 3.0e-4, 1.0e-3], selected: 3.0e-4}
  spend_caps:
    grant_usd: 5000.0
    confirmatory_max_uncommitted_fraction: 0.8
    per_run_usd: null
    total_pilot_usd: null

# Pre-pilot scientific config; calibrations must resolve before protocol freeze.
# Status: pre-pilot; common M0, renderer, TCES completion cap, and Stage-B
# recipe selected.
# The project received a $5,000 Tinker Research Grant; the grant is not spend authority.
seed: 11

protocol:
  version: duraseed-prepilot-v6
  status: direct-m0-stage-a-calibration
  question: >-
    When LLM post-training procedures reach comparable immediate capability,
    do they leave different stability–future-learnability profiles—different
    retention of the newly acquired skill and different efficiency in learning
    the next skill under a fixed supervised adaptation probe?
  method_summary: two core direct-M0 acquisition procedures plus one optional context control and one conditional mechanism pilot
  measured_property: joint stability and future learning efficiency under a fixed supervised Stage-B probe with continued low-rank adaptation
  primary_stage_b_metric: raw_gain_stage_b_auc
  primary_outcomes:
    - targeted_panel_posterior_mean_gain
    - sentinel_panel_posterior_mean_gain
    - targeted_minus_sentinel_specificity
    - raw_gain_stage_b_auc
    - stage_a_retention_at_fixed_stage_b_budget
  secondary_outcomes:
    - stage_a_posterior_soft_cover_at_0.25
    - post_b_posterior_soft_cover_at_0.25_matched_stage_a
    - stage_a_to_b_cover_change
    - zero_shot_stage_b_score
    - absolute_stage_b_auc
    - headroom_normalized_stage_b_gain_auc
    - final_stage_b_score
    - steps_to_threshold
    - stage_a_retention_at_matched_stage_b_progress
    - hard_newly_reliable_to_retained_transitions
    - unbiased_pass_at_k
    - invalid_output_rate
    - strategy_family_diversity
    - zero_variance_reward_group_rate
    - token_use
    - dollar_cost
    - auxiliary_exact_task_regression
  methods:
    - code: G-U
      role: context_control
      execution_phase: optional_pilot
      origin: m0
      teacher_source: none
      acquisition: uniform_prompt_rl
    - code: B-S
      role: core_stability_future_learnability
      execution_phase: initial_pilot
      origin: m0
      teacher_source: fixed_verified_solver
      acquisition: static_sft
    - code: B-O
      role: conditional_mechanism
      execution_phase: conditional_mechanism_pilot
      origin: m0
      teacher_source: none
      acquisition: verified_iterative_on_policy_sft
    - code: B-G
      role: core_stability_future_learnability
      execution_phase: initial_pilot
      origin: m0
      teacher_source: none
      acquisition: boundary_weighted_rl
  candidate_contrasts:
    - left: B-S
      right: B-G
      matched: [m0_origin, targeted_prompt_allocation, adapter_rank, renderer, completion_cap]
      matched_stage_a_performance: true
      qualification: complete procedures differ in data source, trajectory distribution, exploration, objective, token use, and compute
    - left: B-G
      right: G-U
      matched: [m0_origin, rl_configuration, rollout_budget, optimization_budget]
      matched_stage_a_performance: false
      qualification: optional prompt-allocation control; prompt allocation differs
    - left: B-O
      right: B-S
      matched: [m0_origin, stage_a_performance]
      matched_stage_a_performance: true
      qualification: conditional mechanism comparison; current-policy and fixed-solver data differ
    - left: B-G
      right: B-O
      matched: [m0_origin, stage_a_performance]
      matched_stage_a_performance: true
      qualification: conditional secondary objective comparison; no claim of equal data or globally equal compute

tasks:
  tces:
    n_operands: 5
    operand_min: 2
    operand_max: 25
    require_distinct_operands: true
    target_min: -250
    target_max: 250
    require_integer_target: true
    allowed_ops: ["+", "-", "*", "/"]
    allow_fractional_intermediates: true
    max_abs_intermediate: 10000
    max_denominator: 1000
    max_tree_depth: 5
    max_ast_nodes: 31
    max_answer_length: 1024
    exclude_target_in_operands: true
    exclude_trivial_identity_steps: true
    require_positive_intermediates: false
    min_valid_families: 1
    max_valid_families: null
    min_valid_expressions: 1
    max_valid_expressions: null
    ood_n_operands: 4
    max_attempts: 2048
  maps:
    moduli: [17, 19, 23, 29, 31]
    add_constants: [2, 3, 5, 7, 9]
    mul_constants: [2, 3, 5]
    include_neg: true
    allowed_instruction_count: 6
    latent_program_min_length: 2
    latent_program_max_length: 5
    min_shortest_length: 2
    max_shortest_length: 5
    max_shortest_programs: 24
    max_shortest_families: 12
    min_latent_distractors: 1
    require_inverse_pair: false
    blocked_shortest_family_ids: []
    max_attempts: 4096

splits:
  # Used only if the raw zero-update format audit requires a format adapter.
  format:
    format_train: 1024
    format_eval: 256
  tces:
    a_candidate: 8192
    a_seed_train: 4096
    a_seed_gate: 768
    a_rl_train: 16384
    a_monitor: 384
    a_validation: 512
    a_test_single: 512
    a_test_multi: 512
    a_ood: 512
  maps:
    b_train: 4096
    b_validation: 512
    b_monitor: 256
    b_test: 512

boundary_scan:
  broad_samples_per_item: 4
  refinement_samples_per_item_min: 16
  refinement_samples_per_item_max: 32
  finalist_confirmation: true
  provisional_usable_family_target: 24
  provisional_i8_floor: 0.25
  selected_i8_floor: null

# Design only. Panel membership is selected and frozen only after the M0 scan.
family_panels:
  selection_stage: post_m0_boundary_scan
  panel_labels: [A, B]
  frozen_allocation_seed: 6448342238137851489
  balanced_crossover_across_training_seeds: true
  sentinel_distance_diagnostic: equal_weight_gower_nearest_target
  sentinel_distance_role: exploratory_descriptive
  matching_covariates:
    - m0_posterior_mean_success
    - informative_group_probability_i8
    - tree_depth
    - operator_multiset
    - noncommutative_operation_count
    - fractional_intermediate_profile
    - target_magnitude
    - valid_family_multiplicity
    - teacher_trace_length
    - available_disjoint_instances
  size_profiles:
    fallback: {targeted: 8, sentinel: 8}
    first_preferred_pilot: {targeted: 12, sentinel: 12}
    confirmatory: {targeted: 12, sentinel: 12}

teacher_dose:
  demonstrations_per_family: [1, 2, 4, 8, 16]
  selected_demonstrations_per_family: null
  calibration_batch_size: 32
  calibration_updates: 16
  calibration_data_order: canonical_cyclic
  sentinel_samples_per_item: 1
  selection_rule: smallest_dose_then_smallest_passing_learning_rate
  interruption_policy: rerun_bounded_arm
  gate_samples_per_item: 8
  gate_items_per_family: 8
  minimum_mixed_group_rate: 0.30
  minimum_family_reachability: 0.60
  required_format_compliance: 0.97
  maximum_saturated_group_rate: 0.20
  maximum_catastrophic_control_drop: 0.10

stage_a:
  provisional_checkpoint_updates: [0, 10, 25, 50, 100, 200, 400]
  selected_max_updates: null
  provisional_max_tokens: 256
  selected_max_tokens: null
  selected_rl_configuration: null
  entropy_collapse_gate_passed: false
  monitor_samples_per_item: 4
  prompt_distribution_source: frozen_m0_panel_distribution
  mid_training_boundary_rescan: false
  prompt_distribution:
    boundary: 0.50
    intermediate: 0.25
    broad_random: 0.25
  on_policy:
    refresh_every_updates: 25
    max_accepted_per_prompt: 2
    deduplication_key: [task_id, strategy_family_id, canonical_expression]
    teacher_fallback_after_seed: false

stage_b:
  primary_task: maps
  selected_profile: shortest2_cap2
  adaptation: continue_stage_a_lora
  optimizer: fresh
  lora_parameterization: same_as_stage_a
  provisional_evaluation_updates: [0, 1, 2, 5, 10, 20, 40, 80, 160, 320, 480, 640]
  selected_max_updates: 480

evaluation:
  pilot_samples_per_item: 16
  confirmatory_samples_per_item: 32
  selected_method_samples_per_item: 64
  temperature: 1.0
  top_p: 0.95
  reliability_tau_primary: 0.25
  reliability_tau_report: [0.01, 0.02, 0.05, 0.10, 0.25, 0.50, 0.75]
  beta_prior_alpha: 0.5
  beta_prior_beta: 0.5
  hard_reliable_probability: 0.90
  hard_unreliable_probability: 0.10
  pass_at_k: [1, 4, 16, 32]
  primary_stage_b_auc: raw_gain
  secondary_stage_b_aucs: [headroom_normalized, absolute]
  matched_progress_min_pilot_reach_rate: 0.95
  scientific_sampling_seed_required: true
  greedy_selected_checkpoint_sensitivity: true

statistics:
  engineering_seeds: [5]
  calibration_seeds: [17, 37]
  pilot_seeds: [11, 29, 47, 71]
  confirmatory_seeds: [97, 131, 197, 251, 307, 401]
  bootstrap_draws: 5000
  checkpoint_match_metric: mean_item_success
  checkpoint_match_tolerance: 0.015
  checkpoint_selection_candidate_rule: predecessor_first_apparent_crossing_successor
  checkpoint_selection_initial_samples_per_item: 16
  checkpoint_selection_max_samples_per_item: 32
  checkpoint_selection_max_panel_mean_se: 0.0075
  checkpoint_selection_fresh_seed_namespace: stage_a.validation_selection

# Tinker integration values. Renderer, common cap, format warm-up LR, and the
# Stage-B SFT recipe are calibrated; Stage-A learning rates, duration, common
# RL configuration, and shared max-token value remain unresolved.
